<!DOCTYPE html>
<html>

<head>
	<title>PDF Tiler</title>
	<link rel="stylesheet" href="./js/dropzone/dropzone.css">
	<link rel="stylesheet" href="./css/style.css?#nowstr#">

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
	<script src="./js/dropzone/dropzone.js"></script>
	<script language=javascript defer src="./js/pdf_split.js?refresh=#nowstr#"></script>

</head>

<body>
	<div id="dropzonePreviews" class="clickable">
		<div id="divGrid" class="notclickable">
			Grid: <select name="grid" id="grid">
				<option value="">None</option>
				<option value="1">1"</option>
				<option value="2">2"</option>
			</select>
		</div>
		<div id="blurb">
			<p>Select a grid to be added to the output <br />
				(useful for lining up the pages and<br />checking
				the accuracy of your printer)</p>
			<p>Note that <strong>PDF Tiler</strong> only accepts unencrypted, unprotected PDFs<br>up to version 1.4.</p>
			<p><strong>Drop your PDF file here or click to browse your computer.</strong></p>
		</div>
	</div>
	<iframe id="iframe" frameborder="0" style="position: absolute; left: -1500px"></iframe>
	<title-bar>
		<title-bar-title>PDF Tiler</title-bar-title>
	</title-bar>
</body>

</html>
